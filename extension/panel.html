<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Log</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="head">
  <div class="title-row">
    <h1>Action Log</h1>
    <span class="status" id="status" role="status" aria-live="polite">Connecting…</span>
  </div>
  <p class="page" id="page" translate="no"></p>
  <p class="gate" id="gate" aria-live="polite">Checking whether this page is school work…</p>
  <div class="tools">
    <label class="search">
      <span class="sr-only">Search actions</span>
      <input id="search" type="search" name="action-search" placeholder="Search actions, URLs, values…" autocomplete="off" spellcheck="false">
    </label>
    <button type="button" id="frames" class="btn" aria-pressed="true" title="Show actions inside embedded frames (ads, videos, widgets)">Frames</button>
    <button type="button" id="pause" class="btn" aria-pressed="false">Pause</button>
    <button type="button" id="export" class="btn">Export JSON</button>
    <button type="button" id="clear" class="btn">Clear</button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Show action types"></div>
</header>
<main id="main">
  <p class="undo" id="undo" hidden><span id="undo-text"></span> <button type="button" id="undo-btn" class="link">Undo</button></p>
  <div class="empty" id="empty" hidden></div>
  <ol class="log" id="log" aria-label="Actions, newest first"></ol>
</main>
<footer class="foot" id="sync" role="status" aria-live="polite">Saving to SkillBridge…</footer>
<script src="panel.js"></script>
</body>
</html>
